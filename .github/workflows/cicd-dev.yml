name: MovieBookie CI/CD For Dev Pipeline

on:
  pull_request:
    branches: [ "develop" ]
    paths-ignore:
      - "src/main/resources/db/changelog/**"
      - "src/main/resources/db/changelog-backup/**"
  push:
    branches: [ "develop" ]
    paths-ignore:
      - "src/main/resources/db/changelog/**"
      - "src/main/resources/db/changelog-backup/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 레포지토리 체크아웃
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_ACCESS_TOKEN }}
          submodules: true

      - name: Update submodule
        run: |
          git submodule update --remote --recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # gradle caching - 빌드 시간 향상
      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        shell: bash

      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test -Pprofile=dev
        shell: bash

      - name: Liquibase schema gate (fail on mismatch)
        shell: bash
        run: |
          ./gradlew --no-daemon status -PrunList=devUpdate \
            -PDEV_DB_URL="${{ secrets.DEV_DB_URL }}" \
            -PDEV_DB_USERNAME="${{ secrets.DEV_DB_USERNAME }}" \
            -PDEV_DB_PASSWORD="${{ secrets.DEV_DB_PASSWORD }}" | tee liquibase-status.log

          PENDING_LINE=$(grep -Eo '[0-9]+ changesets have not been applied' liquibase-status.log | head -n 1 || true)
          if [[ -n "$PENDING_LINE" ]]; then
            PENDING_COUNT=$(echo "$PENDING_LINE" | awk '{print $1}')
            if [[ "$PENDING_COUNT" -gt 0 ]]; then
              echo "::error::Liquibase schema mismatch detected. Pending changesets: $PENDING_COUNT"
              exit 1
            fi
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: moviebookie-dev
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 Dev Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            ECR_IMAGE=$ECR_REGISTRY/moviebookie-dev:${{ github.sha }}
            REGION=${{ secrets.AWS_REGION }}

            INSTANCE1_CONTAINER=moviebookie-dev-1
            INSTANCE2_CONTAINER=moviebookie-dev-2
            INSTANCE1_PORT=8080
            INSTANCE2_PORT=8082

            NGINX_UPSTREAM_FILE_INPUT="${{ secrets.DEV_NGINX_UPSTREAM_FILE }}"
            HEALTH_PATH_INPUT="${{ secrets.DEV_HEALTH_PATH }}"

            NGINX_UPSTREAM_FILE=${NGINX_UPSTREAM_FILE_INPUT:-/etc/nginx/conf.d/moviebookie-dev-upstream.conf}
            HEALTH_PATH=${HEALTH_PATH_INPUT:-/actuator/health}
            HEALTH_MAX_RETRIES=${HEALTH_MAX_RETRIES:-30}
            HEALTH_SLEEP_SECONDS=${HEALTH_SLEEP_SECONDS:-3}

            aws ecr get-login-password --region "$REGION" | sudo docker login --username AWS --password-stdin "$ECR_REGISTRY"
            sudo docker pull "$ECR_IMAGE"

            write_nginx_upstream() {
              sudo tee "$NGINX_UPSTREAM_FILE" >/dev/null <<EOF
            upstream moviebookie_dev_active {
              server 127.0.0.1:${INSTANCE1_PORT} max_fails=3 fail_timeout=10s;
              server 127.0.0.1:${INSTANCE2_PORT} max_fails=3 fail_timeout=10s;
              keepalive 32;
            }
            EOF
              sudo nginx -t
              sudo nginx -s reload
            }

            wait_for_local_health() {
              local port="$1"
              local url="http://127.0.0.1:${port}${HEALTH_PATH}"

              for ((i=1; i<=HEALTH_MAX_RETRIES; i++)); do
                if curl -fsS "$url" >/dev/null; then
                  echo "Local health check succeeded: $url"
                  return 0
                fi
                echo "Waiting for local health (${i}/${HEALTH_MAX_RETRIES}): $url"
                sleep "$HEALTH_SLEEP_SECONDS"
              done

              return 1
            }

            deploy_instance() {
              local container_name="$1"
              local host_port="$2"

              echo "Deploying container: $container_name on port $host_port"
              sudo docker rm -f "$container_name" || true
              sudo docker run -d \
                --name "$container_name" \
                --restart unless-stopped \
                -p "${host_port}:8080" \
                -e SPRING_PROFILES_ACTIVE=dev \
                -e TZ=Asia/Seoul \
                -e SLOT="$container_name" \
                "$ECR_IMAGE"

              if ! wait_for_local_health "$host_port"; then
                echo "Health check failed: $container_name"
                sudo docker logs --tail 200 "$container_name" || true
                sudo docker rm -f "$container_name" || true
                return 1
              fi
            }

            deploy_instance "$INSTANCE1_CONTAINER" "$INSTANCE1_PORT"
            deploy_instance "$INSTANCE2_CONTAINER" "$INSTANCE2_PORT"

            write_nginx_upstream
            echo "Dev multi-instance deployment succeeded with two active containers."
